services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: curator
      POSTGRES_PASSWORD: curator
      POSTGRES_DB: curator_db
    ports:
      # 5432 collides with a native Postgres already on this machine, and 5433
      # is already used by another local project's container — use 5434.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curator -d curator_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
